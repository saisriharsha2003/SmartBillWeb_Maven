version: '3.8'

services:
  smartbill-mysql:
    image: mysql:8.0
    container_name: smartbill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: Harsha@2005
      MYSQL_DATABASE: smartbilldb
      MYSQL_USER: saisriharsha2005
      MYSQL_PASSWORD: ArjunSai@2005
    ports:
      - "3307:3306"
    
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pHarsha@2005"]
      interval: 10s
      timeout: 5s
      retries: 5

  smartbill-app:
    build: .
    container_name: smartbill-app
    ports:
      - "8081:8080"
    depends_on:
      smartbill-mysql:
        condition: service_healthy
